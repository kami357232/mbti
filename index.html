<style>
  :root{
    --bg:#f5f6fa; --card:#ffffff; --ink:#1c1e26; --muted:#6b7280;
    --line:#e5e7eb; --accent:#4f46e5; --accent-soft:#eef2ff;
    --good:#0f9d58; --warn:#d97706; --bad:#b91c1c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111318; --card:#191c23; --ink:#e8eaef; --muted:#9aa1ac;
      --line:#2a2f39; --accent:#8b8bf5; --accent-soft:#20222e;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:calc(16px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  #app{width:100%;max-width:560px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 18px; box-shadow:0 1px 2px rgba(0,0,0,.04);
  }
  h1{font-size:22px;margin:0 0 6px;letter-spacing:.2px}
  h2{font-size:17px;margin:22px 0 8px}
  p{margin:0 0 10px}
  .muted{color:var(--muted);font-size:14px}
  .small{font-size:12.5px}
  .tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:0 6px 6px 0}
  .btn{
    display:block;width:100%;border:1px solid var(--line);background:var(--card);
    color:var(--ink);font:inherit;font-size:16px;line-height:1.5;
    padding:15px 16px;border-radius:13px;margin:10px 0;text-align:left;cursor:pointer;
    transition:transform .06s ease, background .16s ease, border-color .16s ease;
  }
  .btn:active{transform:scale(.985)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center;font-weight:600}
  .btn.picked{border-color:var(--accent);background:var(--accent-soft)}
  .btn.picked::after{content:"✓";float:right;font-weight:700;color:var(--accent);margin-left:8px}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .btn.ghost{background:transparent;text-align:center;color:var(--muted);border-style:dashed;font-size:14px;padding:11px}
  .bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0 18px}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
  .q{font-size:19px;line-height:1.55;margin:4px 0 16px;font-weight:600}
  .type{font-size:44px;font-weight:800;letter-spacing:3px;margin:2px 0 4px;color:var(--accent)}
  .type-name{font-size:18px;font-weight:600;margin-bottom:10px}
  .dim{margin:16px 0}
  .dim .label{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13.5px;margin-bottom:5px}
  .dim .label b{font-weight:700}
  .dim .desc{font-size:12px;color:var(--muted);text-align:center;margin-top:5px}
  .rail{display:flex;height:9px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .rail span{display:block;height:100%}
  .rail .l{background:var(--accent)}
  .rail .r{background:var(--line)}
  ul.chips{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:8px}
  ul.chips li{font-size:13px;padding:5px 10px;border-radius:9px;background:var(--accent-soft);color:var(--ink)}
  ul.list{margin:6px 0 0;padding-left:20px}
  ul.list li{margin:5px 0}
  .foot{color:var(--muted);font-size:12.5px;line-height:1.7;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
  .note{border-left:3px solid var(--warn);background:rgba(217,119,6,.08);padding:10px 12px;border-radius:8px;font-size:13.5px;margin:12px 0}
  .note.bad{border-color:var(--bad);background:rgba(185,28,28,.08)}
  .note.ok{border-color:var(--good);background:rgba(15,157,88,.08)}
  .row{display:flex;gap:10px}
  .row .btn{margin:10px 0 0}
  details.adv{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:0 12px}
  details.adv summary{cursor:pointer;padding:11px 0;font-size:14px;color:var(--muted)}
  details.adv .inner{padding-bottom:12px;font-size:14px}
  .stack{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--accent-soft);padding:8px 10px;border-radius:8px;display:inline-block}

<script>
/* ===================== 题库 =====================
   40 题：每个维度 10 题，其中 3 题为反向计分（rev:true）。
   反向题的作用：① 降低"一路选同一个位置"的惯性偏差；② 让直线作答可被识别。
   选项 a / b 只描述行为，不出现维度术语。
================================================== */
const QUESTIONS = [
  // ---------- E / I（10 题，含 3 道反向）----------
  {axis:"EI", rev:false, q:"周末突然空出半天，你第一反应是……", a:"约人出门，找朋友聊聊天", b:"一个人待着，做点自己的事"},
  {axis:"EI", rev:false, q:"在一个基本都是陌生人的场合，你通常……", a:"主动和几个人搭话", b:"先观察，等别人来找你"},
  {axis:"EI", rev:false, q:"想把一件事想清楚时，你更常……", a:"边说边想，说出来才理顺", b:"先在心里想明白，再开口"},
  {axis:"EI", rev:false, q:"连续社交一整天后，你的感觉是……", a:"还挺兴奋，能继续", b:"明显被掏空，需要独处充电"},
  {axis:"EI", rev:false, q:"遇到烦心事，你更倾向于……", a:"找人说出来", b:"自己先消化"},
  {axis:"EI", rev:false, q:"你的社交圈更接近……", a:"认识的人多，圈子比较广", b:"少数几个很熟，交往很深"},
  {axis:"EI", rev:false, q:"在小组讨论里，你更常……", a:"主动开口，推动话题往前走", b:"听得多，想清楚再发言"},
  {axis:"EI", rev:true,  q:"一个新的聚餐邀约，你更常见的反应是……", a:"先想想要不要推掉，人多会累", b:"先答应下来，到时候再调整状态"},
  {axis:"EI", rev:true,  q:"别人临时打电话来聊事情，你的第一感受是……", a:"有点被打断，希望改成文字", b:"挺好，正好聊聊"},
  {axis:"EI", rev:true,  q:"需要专注做事时，你更喜欢……", a:"一个人安静的环境", b:"有人在场，哪怕各干各的"},

  // ---------- S / N（10 题，含 3 道反向）----------
  {axis:"SN", rev:false, q:"学一样新东西时，你更信任……", a:"具体例子和可以照做的步骤", b:"背后的原理和整体框架"},

  {axis:"SN", rev:false, q:"你更享受哪种过程……", a:"把已经有的东西打磨得更精细", b:"想出一个还没人做过的点子"},

];

const DIMS = [
  {key:"EI", l:"E", r:"I", ln:"外向", rn:"内向", desc:"能量从哪里来"},
  {key:"SN", l:"S", r:"N", ln:"实感", rn:"直觉", desc:"怎么接收信息"},
  {key:"TF", l:"T", r:"F", ln:"思考", rn:"情感", desc:"怎么做决定"},
  {key:"JP", l:"J", r:"P", ln:"判断", rn:"知觉", desc:"怎么安排生活"},
];

const SAVE_KEY = "mbti_progress_v2";

/* ===================== 计分 ===================== */
function shuffle(arr, rnd){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 打乱题目顺序，并尽量避免同一维度连续出现 3 次以上 */
function buildOrder(rnd = Math.random){
  const idx = QUESTIONS.map((_, i) => i);
  for (let attempt = 0; attempt < 40; attempt++){
    const order = shuffle(idx, rnd);
    let ok = true, run = 1;
    for (let i = 1; i < order.length; i++){
      run = QUESTIONS[order[i]].axis === QUESTIONS[order[i - 1]].axis ? run + 1 : 1;
      if (run >= 3){ ok = false; break; }
    }
    if (ok) return order;
  }
  return shuffle(idx, rnd);
}

/* records: [{axis, rev, choice}]  choice ∈ 'a' | 'b' | 'n' */
function compute(records){
  const counts = {EI:{E:0,I:0}, SN:{S:0,N:0}, TF:{T:0,F:0}, JP:{J:0,P:0}};
  const stat = {total:0, neutral:0, a:0, b:0};
  for (const q of records){
    const d = DIMS.find(x => x.key === q.axis);
    stat.total++;
    if (!q.choice || q.choice === "n"){
      stat.neutral++;
      counts[q.axis][d.l] += 0.5;
      counts[q.axis][d.r] += 0.5;
      continue;
    }
    const pickedLeft = (q.choice === "a") !== Boolean(q.rev);
    counts[q.axis][pickedLeft ? d.l : d.r] += 1;
    if (q.choice === "a") stat.a++; else stat.b++;
  }

  let code = "";
  const axes = [];
  for (const d of DIMS){
    const c = counts[d.key];
    const total = c[d.l] + c[d.r];
    const leftPct = total ? Math.round((c[d.l] / total) * 100) : 50;
    const diff = Math.abs(leftPct - 50);
    const band = diff < 10 ? "middle" : diff < 30 ? "lean" : "clear";
    const letter = c[d.l] >= c[d.r] ? d.l : d.r;
    code += letter;
    axes.push({
      key:d.key, desc:d.desc, left:d.ln, right:d.rn,
      leftLetter:d.l, rightLetter:d.r,
      leftPct, rightPct: 100 - leftPct,
      pick: letter, band, total,
    });
  }

  const answered = stat.a + stat.b;
  const straight = answered ? Math.max(stat.a, stat.b) / answered : 0;
  const confidence =
    (stat.neutral / stat.total > 0.3 || straight > 0.9) ? "low" :
    (stat.neutral / stat.total > 0.15 || straight > 0.8) ? "medium" : "high";

  return {code, axes, stat, straight, confidence};
}

/* ===================== 状态 ===================== */
const app = document.getElementById("app");
const state = { order: buildOrder(), pos: 0, answers: [], startedAt: Date.now(), view: "intro" };

function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
}
function save(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      order: state.order, pos: state.pos, answers: state.answers, startedAt: state.startedAt,
    }));
  } catch (e) { /* 隐私模式等情况忽略 */ }
}
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!Array.isArray(s.order) || s.order.length !== QUESTIONS.length) return null;
    if (typeof s.pos !== "number" || s.pos <= 0 || s.pos >= QUESTIONS.length) return null;
    return s;
  } catch (e) { return null; }
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function records(){
  return state.order.map((qi, i) => ({
    axis: QUESTIONS[qi].axis, rev: QUESTIONS[qi].rev,
    choice: state.answers[i] || null,
  }));
}

/* ===================== 视图 ===================== */
function renderIntro(){
  const saved = loadSave();
  app.innerHTML = `
    <div class="card">
      <h1>MBTI 人格小测试</h1>
      <p class="muted">${QUESTIONS.length} 道题，约 5 分钟。凭第一反应选，不要纠结“哪个更好”。</p>
      <p style="margin-top:14px">
        <span class="tag">4 个维度</span><span class="tag">16 种类型</span><span class="tag">含反向题</span><span class="tag">纯本地计算</span>
      </p>
      <p class="muted small" style="margin-top:10px">
        题目每次随机排序；有 ${QUESTIONS.filter(q => q.rev).length} 道是反向表述，用来抵消答题惯性。
        所有作答只存在你自己的浏览器里，不会上传。
      </p>
      ${saved ? `<button class="btn primary" id="resume">继续上次（第 ${saved.pos + 1} 题）</button>
                 <button class="btn" id="fresh">重新开始</button>`
              : `<button class="btn primary" id="start">开始测试</button>`}
      <div class="foot">
        本测试基于自我报告，结果用于自我了解与交流参考，<b>不是心理诊断，也不适合作为招聘或筛选依据</b>。
        同一个人在不同情境、不同时期的结果可能不同。
      </div>
    </div>`;

  const start = () => {
    state.order = buildOrder();
    state.pos = 0; state.answers = []; state.startedAt = Date.now();
    state.view = "quiz"; save(); renderQuiz();
  };
  const el = id => document.getElementById(id);
  if (saved && el("resume")){
    el("resume").onclick = () => {
      Object.assign(state, { order: saved.order, pos: saved.pos, answers: saved.answers, startedAt: saved.startedAt });
      state.view = "quiz"; renderQuiz();
    };
    el("fresh").onclick = start;
  } else if (el("start")){
    el("start").onclick = start;
  }
}

function renderQuiz(){
  const qi = state.order[state.pos];
  const q = QUESTIONS[qi];
  const chosen = state.answers[state.pos];
  const pct = Math.round((state.pos / QUESTIONS.length) * 100);

  app.innerHTML = `
    <div class="card">
      <div class="muted small" style="display:flex;justify-content:space-between">
        <span>第 ${state.pos + 1} / ${QUESTIONS.length} 题</span>
        <span>${DIMS.find(d => d.key === q.axis).desc}</span>
      </div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${QUESTIONS.length}"
           aria-valuenow="${state.pos}" aria-label="答题进度"><i style="width:${pct}%"></i></div>
      <p class="sr" aria-live="polite" id="progress-live">第 ${state.pos + 1} 题，共 ${QUESTIONS.length} 题，已完成 ${pct}%</p>
      <div class="q" id="question">${esc(q.q)}</div>
      <button class="btn${chosen === "a" ? " picked" : ""}" data-v="a" aria-pressed="${chosen === "a"}">${esc(q.a)}</button>
      <button class="btn${chosen === "b" ? " picked" : ""}" data-v="b" aria-pressed="${chosen === "b"}">${esc(q.b)}</button>
      <button class="btn ghost${chosen === "n" ? " picked" : ""}" data-v="n" aria-pressed="${chosen === "n"}">两个都不像，跳过</button>
      ${state.pos > 0 ? `<button class="btn ghost" id="back">← 上一题${chosen ? "（已答，可改）" : ""}</button>` : ''}
    </div>`;

  app.querySelectorAll("[data-v]").forEach(el => {
    el.onclick = () => {
      state.answers[state.pos] = el.dataset.v;
      if (state.pos === QUESTIONS.length - 1){
        clearSave();
        state.view = "result";
        renderResult();
      } else {
        state.pos += 1;
        save();
        renderQuiz();
      }
    };
  });
  const back = document.getElementById("back");
  if (back) back.onclick = () => { state.pos -= 1; save(); renderQuiz(); };
}

function renderResult(){
  const r = compute(records());
  const t = TYPES[r.code] || TYPES.ISTJ;
  const elapsed = Math.round((Date.now() - state.startedAt) / 1000);

  const bandText = {middle:"中间型", lean:"倾向型", clear:"明确型"};
  const bars = r.axes.map(a => `
    <div class="dim">
      <div class="label">
        <span style="${a.pick === a.leftLetter ? "font-weight:700" : ""}">${a.left} ${a.leftLetter} · ${a.leftPct}%</span>
        <span style="${a.pick === a.rightLetter ? "font-weight:700" : ""}">${a.rightPct}% · ${a.rightLetter} ${a.right}</span>
      </div>
      <div class="rail"><span class="l" style="width:${a.leftPct}%"></span><span class="r" style="width:${a.rightPct}%"></span></div>
      <div class="desc">${a.desc} · ${bandText[a.band]}</div>
    </div>`).join("");

  const middles = r.axes.filter(a => a.band === "middle");
  const conf = {
    high:  `<div class="note ok">作答质量良好：${QUESTIONS.length} 题中只跳过 ${r.stat.neutral} 题，答案分布也比较自然。</div>`,
    medium: `<div class="note">提示：跳过 ${r.stat.neutral} 题${r.straight > 0.8 ? "，且选项集中在同一侧" : ""}，结果可能有偏差。</div>`,
    low:   `<div class="note bad">可信度偏低：跳过 ${r.stat.neutral} 题${r.straight > 0.9 ? "，超过九成答案都在同一侧（可能没认真区分选项）" : ""}${elapsed < 60 ? `，全程只用了 ${elapsed} 秒` : ""}。建议重测一次。</div>`,
  }[r.confidence];

  const midNote = middles.length
    ? `<div class="note">${middles.map(a => `${a.left}/${a.right}`).join("、")} 的差异不到 10%，属于<b>中间型</b>——这条线上你比较灵活，别把自己钉死在某一边。</div>`
    : "";

  app.innerHTML = `
    <div class="card">
      <p class="muted" style="margin-bottom:2px">你的类型</p>
      <div class="type">${r.code}</div>
      <div class="type-name">${t.n} · ${t.s}</div>
      ${conf}${midNote}
      ${bars}

      <h2>你的优势</h2>
      <ul class="list">${t.g.map(x => `<li>${esc(x)}</li>`).join("")}</ul>

      <h2>别人容易误读你的地方</h2>
      <p class="small">${esc(t.misread)}</p>

      <h2>压力下的你</h2>
      <p class="small">${esc(t.stress)}</p>

      <h2>可能的盲点</h2>
      <ul class="list">${t.b.map(x => `<li>${esc(x)}</li>`).join("")}</ul>

      <h2>方向参考</h2>
      <ul class="chips">${t.c.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
      <p class="muted small" style="margin-top:8px">这些方向对这类偏好更友好，但<b>类型不构成职业限制</b>，也不是招聘依据。</p>

      <details class="adv">
        <summary>进阶解读（认知功能栈）</summary>
        <div class="inner">
          <p><span class="stack">${t.stack}</span></p>
          <p class="muted small">依次是你最惯用的四种心理功能：前两位最自然，第四位最不熟练、压力下最容易失衡。
          MBTI 圈内常用它解释"为什么同类型的人也不一样"。</p>
        </div>
      </details>

      <div class="row">
        <button class="btn primary" id="again" style="flex:1">重新测试</button>
        <button class="btn" id="copy" style="flex:1;text-align:center">复制结果</button>
      </div>
      <div class="foot">
        仅供自我探索，不是心理诊断。类型描述是"倾向"，不是"定义"——你可以不受它限制。<br>
        共 ${QUESTIONS.length} 题 · 跳过 ${r.stat.neutral} 题 · 用时 ${elapsed} 秒
      </div>
    </div>`;

  document.getElementById("again").onclick = () => {
    clearSave();
    state.order = buildOrder();
    state.pos = 0; state.answers = []; state.startedAt = Date.now();
    state.view = "intro"; renderIntro();
  };
  document.getElementById("copy").onclick = async () => {
    const text = `我的 MBTI 类型：${r.code}（${t.n}）\n` +
      r.axes.map(a => `${a.left}/${a.right}：${a.leftPct}% / ${a.rightPct}%（${bandText[a.band]}）`).join("\n") +
      `\n—— MBTI 人格小测试`;
    const btn = document.getElementById("copy");
    try { await navigator.clipboard.writeText(text); btn.textContent = "已复制"; }
    catch (e) { window.prompt("长按复制：", text); }
  };
}

/* 便于 Node 测试 / 截图预览 */
if (typeof window !== "undefined"){
  window.__MBTI = { QUESTIONS, TYPES, DIMS, compute, buildOrder, renderIntro, renderQuiz, renderResult, state, SAVE_KEY };
}
renderIntro();
</script>
